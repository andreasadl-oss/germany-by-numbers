<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Germany by Numbers / Deutschland nach Zahlen</title>
  <desc id="d">Open, reliable data about Germany, free for everyone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcfb"/>
      <stop offset="1" stop-color="#f1efe8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="#0b0b0b" stroke-opacity="0.08"/>

  <!-- logo: the site's three-bar favicon -->
  <g transform="translate(64 78) scale(4.6)">
    <rect x="4" y="18" width="7" height="10" rx="2" fill="#2a78d6"/>
    <rect x="12.5" y="11" width="7" height="17" rx="2" fill="#1baf7a"/>
    <rect x="21" y="4" width="7" height="24" rx="2" fill="#eda100"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="232" y="138" font-size="58" font-weight="700" fill="#0b0b0b" letter-spacing="-1">Germany by Numbers</text>
    <text x="234" y="184" font-size="30" font-weight="500" fill="#52514e">Deutschland nach Zahlen</text>
    <text x="234" y="232" font-size="22" fill="#898781">Open, reliable data about Germany · free for everyone</text>
  </g>

  <!-- a small bar chart in the site's series colours -->
  <g transform="translate(900 70)">
    <line x1="0" y1="170" x2="236" y2="170" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="6"   y="120" width="22" height="50"  rx="4" fill="#2a78d6"/>
    <rect x="35"  y="96"  width="22" height="74"  rx="4" fill="#eb6834"/>
    <rect x="64"  y="104" width="22" height="66"  rx="4" fill="#1baf7a"/>
    <rect x="93"  y="70"  width="22" height="100" rx="4" fill="#eda100"/>
    <rect x="122" y="82"  width="22" height="88"  rx="4" fill="#e87ba4"/>
    <rect x="151" y="48"  width="22" height="122" rx="4" fill="#6250d6"/>
    <rect x="180" y="60"  width="22" height="110" rx="4" fill="#e34948"/>
    <rect x="209" y="24"  width="22" height="146" rx="4" fill="#1fa5c4"/>
  </g>
</svg>
