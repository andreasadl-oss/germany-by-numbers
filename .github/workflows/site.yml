name: Refresh data and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch data from official sources
        if: github.event_name != 'push'
        # A failing source keeps its last good CSV; the run continues.
        env:
          # Optional; see docs/DESTATIS_SETUP.md. Empty if the secrets are not set.
          DESTATIS_TOKEN: ${{ secrets.DESTATIS_TOKEN }}
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASSWORD: ${{ secrets.DESTATIS_PASSWORD }}
        run: python pipeline/fetch.py || echo "::warning::Some indicators failed to refresh - see log above"

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%F)"
          git push

      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
